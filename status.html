<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LABS67 — Status Dashboard</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;
  --text:#e8e6e2;--muted:#888;--border:rgba(255,255,255,0.06);
  --gold:#B8860B;--gold2:#D4A017;
  --green:#22c55e;--red:#ef4444;--yellow:#eab308;--cyan:#30dcff;
  --mono:'JetBrains Mono',monospace;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* COMMON TOPBAR */
.topbar{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:48px;background:rgba(10,10,15,0.92);backdrop-filter:blur(24px);border-bottom:1px solid var(--border)}
.tb-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.tb-hex{width:28px;height:28px;background:linear-gradient(135deg,var(--gold),var(--gold2));clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:7px;font-weight:600;color:#fff}
.tb-name{font-weight:800;font-size:14px;letter-spacing:0.15em}
.tb-name em{color:var(--gold);font-style:normal}
.tb-links{display:flex;gap:2px}
.tb-links a{padding:5px 12px;font-size:10px;font-weight:500;letter-spacing:0.06em;color:var(--muted);text-decoration:none;border-radius:4px;transition:all 0.3s;font-family:var(--mono)}
.tb-links a:hover{color:var(--gold);background:rgba(184,134,11,0.1)}
.tb-links a.active{color:var(--gold);background:rgba(184,134,11,0.1)}
.tb-right{display:flex;align-items:center;gap:16px}
/* LANG DROPDOWN */
.lang-switcher{position:relative}
.lang-current{font-family:var(--mono);font-size:9px;letter-spacing:0.06em;padding:4px 10px;border:1px solid var(--border);border-radius:3px;background:transparent;color:var(--muted);cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px}
.lang-current:hover{color:var(--accent,var(--gold));border-color:var(--accent,var(--gold))}
.lang-dropdown{position:absolute;top:calc(100% + 6px);right:0;background:var(--bg2,#111118);border:1px solid var(--border);border-radius:6px;box-shadow:0 8px 32px rgba(0,0,0,0.4);min-width:140px;max-height:300px;overflow-y:auto;opacity:0;pointer-events:none;transform:translateY(-8px);transition:all 0.25s ease;z-index:200}
.lang-switcher.open .lang-dropdown{opacity:1;pointer-events:auto;transform:translateY(0)}
.lang-opt{display:block;width:100%;padding:8px 14px;border:none;background:none;font-family:var(--mono);font-size:10px;letter-spacing:0.04em;color:var(--muted);cursor:pointer;text-align:left;transition:all 0.15s}
.lang-opt:hover{background:rgba(255,255,255,0.04);color:var(--accent,var(--gold))}
.lang-opt.active{color:var(--accent,var(--gold));font-weight:500}
.tb-ver{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:0.1em;opacity:0.5}
.tb-status{font-family:var(--mono);font-size:10px;letter-spacing:0.1em;color:var(--green)}
.tb-time{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:0.06em}
@media(max-width:768px){.topbar{padding:0 12px}.tb-links{display:none}}

.dash-hero{padding:100px 40px 60px;text-align:center}
.dash-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
.dash-hero h1{font-family:'Syne',sans-serif;font-size:clamp(32px,5vw,52px);font-weight:800;margin-bottom:12px}
.dash-hero h1 em{color:var(--gold);font-style:normal}
.dash-hero-sub{font-size:15px;color:var(--muted);max-width:500px;margin:0 auto}

.dash-stats{display:flex;justify-content:center;gap:48px;padding:0 40px 60px}
.dash-stat{text-align:center}
.dash-stat-num{font-family:'Syne',sans-serif;font-size:36px;font-weight:800;color:var(--gold)}
.dash-stat-label{font-family:var(--mono);font-size:9px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-top:4px}

.dash-grid{max-width:1100px;margin:0 auto;padding:0 40px 80px;display:grid;grid-template-columns:1fr;gap:16px}

.site-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:28px 32px;display:grid;grid-template-columns:1fr auto;gap:20px;transition:border-color 0.2s}
.site-card:hover{border-color:rgba(184,134,11,0.3)}
.site-top{display:flex;align-items:center;gap:16px;margin-bottom:12px}
.site-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.site-dot.live{background:var(--green);box-shadow:0 0 8px rgba(34,197,94,0.5)}
.site-dot.dev{background:var(--yellow);box-shadow:0 0 8px rgba(234,179,8,0.4)}
.site-dot.offline{background:var(--red);box-shadow:0 0 8px rgba(239,68,68,0.4)}
.site-name{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;letter-spacing:0.02em}
.site-name em{color:var(--gold);font-style:normal}
.site-url{font-family:var(--mono);font-size:11px;color:var(--gold);text-decoration:none;letter-spacing:0.04em}
.site-url:hover{color:var(--gold2);text-decoration:underline}
.site-desc{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:16px}
.site-tags{display:flex;flex-wrap:wrap;gap:6px}
.site-tag{font-family:var(--mono);font-size:9px;letter-spacing:0.06em;padding:4px 10px;border-radius:4px;background:rgba(255,255,255,0.04);color:var(--muted);border:1px solid var(--border)}
.site-tag.green{color:var(--green);border-color:rgba(34,197,94,0.2);background:rgba(34,197,94,0.06)}
.site-tag.gold{color:var(--gold);border-color:rgba(184,134,11,0.2);background:rgba(184,134,11,0.06)}
.site-tag.cyan{color:var(--cyan);border-color:rgba(48,220,255,0.2);background:rgba(48,220,255,0.06)}
.site-tag.red{color:#ff6b6b;border-color:rgba(255,107,107,0.2);background:rgba(255,107,107,0.06)}

.site-right{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:6px;min-width:120px}
.site-status{font-family:var(--mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase}
.site-status.live{color:var(--green)}
.site-status.dev{color:var(--yellow)}
.site-langs{font-family:var(--mono);font-size:11px;color:var(--muted)}

.dash-footer{text-align:center;padding:40px;border-top:1px solid var(--border);font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:0.1em}

@media(max-width:768px){
  .dash-nav{padding:0 20px}
  .dash-hero{padding:80px 20px 40px}
  .dash-stats{flex-wrap:wrap;gap:24px;padding:0 20px 40px}
  .dash-grid{padding:0 16px 60px}
  .site-card{grid-template-columns:1fr;padding:20px}
  .site-right{flex-direction:row;align-items:center;gap:12px}
}
</style>
</head>
<body>

<div class="dash-grid" id="grid"></div>

<footer class="dash-footer">
