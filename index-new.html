body.theme-svita { --bg:#0a080e; --panel:rgba(10,8,14,0.94); --accent:#a48bfa; --accent2:#c4b0ff; --accent-dim:rgba(164,139,250,0.08); --white:#ece8f4; --text:#9088a0; --muted:#504860; --border:rgba(164,139,250,0.08); }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }

/* TOPBAR */
.topbar {

.tb-hex {

  font-family: var(--mono); font-size: 7px; font-weight: 600; color: #fff;

}
.tb-name { font-weight: 800; font-size: 14px; letter-spacing: 0.15em; }
.tb-name em { color: var(--accent); font-style: normal; transition: color 0.6s; }
.tb-links { display: flex; gap: 2px; }
.tb-links a {

  color: var(--muted); text-decoration: none; border-radius: 4px; transition: all 0.3s;
  font-family: var(--mono);
}
.tb-links a:hover, .tb-links a.active { color: var(--accent); background: var(--accent-dim); }
.tb-right { display: flex; align-items: center; gap: 10px; }
.tb-status { font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tb-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); animation: blink 2s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

#content {

}
#content.open { transform: translateX(0); }
#content::-webkit-scrollbar { width: 4px; }
#content::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }
.cp { padding: 32px 28px 60px; }
.cp-close {

.cp-cat { font-family: var(--mono); font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.cp-title { font-family: var(--serif); font-size: 2.2rem; color: var(--white); font-weight: 400; letter-spacing: 0.08em; line-height: 1.1; margin-bottom: 12px; }

.cp-section { margin-bottom: 24px; }
.cp-section h3 { font-family: var(--serif); font-size: 1.1rem; color: var(--white); font-weight: 400; margin-bottom: 8px; }
.cp-section p, .cp-section li { font-size: 0.82rem; line-height: 1.7; }

.cp-section ul li { padding: 3px 0 3px 16px; position: relative; }

.cp-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }

.cp-stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 16px 0; }

.sp-link:hover .sp-dot{transform:scale(1.3)}
.sp-name{font-family:'Inter',sans-serif;font-size:14px;font-weight:600;color:#ededf0;white-space:nowrap;opacity:0;transform:translateX(-8px);transition:all .3s cubic-bezier(.16,1,.3,1);letter-spacing:-.01em}

@media(max-width:960px){.side-panel{display:none}}
@media(max-width:768px){

  cv.style.width = W+'px'; cv.style.height = H+'px';
  c.setTransform(dpr,0,0,dpr,0,0);
  let fitZoom = W <= 768 ? Math.min(W,H)/800 : Math.min(W,H)/1200;
  zoom = fitZoom; targetZoom = fitZoom;
  initStars();
}
window.addEventListener('resize', resize);

// Background stars
function initStars() {
  bgStars = [];
  for(let i=0; i<200; i++) {
    bgStars.push({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.2+0.2,
      a: Math.random()*0.15+0.02,
      speed: Math.random()*0.0015+0.0005,
      phase: Math.random()*Math.PI*2
    });
  }
}

resize();

// Layout — hexagonal
const hub = NODES[0];
hub.x=0; hub.y=0; hub.vx=0; hub.vy=0;
const rest = NODES.slice(1);
const hexR = 340;
rest.forEach((n,i) => {
  const a = (Math.PI*2/6)*i - Math.PI/2;
  n.x = Math.cos(a)*hexR; n.y = Math.sin(a)*hexR;
  n.vx=0; n.vy=0;
});

function sim() {
  const ns=NODES;
  for(let i=0;i<ns.length;i++){
    for(let j=i+1;j<ns.length;j++){
      let dx=ns[j].x-ns[i].x, dy=ns[j].y-ns[i].y;
      let d=Math.sqrt(dx*dx+dy*dy)||1;
      let f=Math.min(22000/(d*d),200);
      ns[i].vx-=(dx/d)*f; ns[i].vy-=(dy/d)*f;
      ns[j].vx+=(dx/d)*f; ns[j].vy+=(dy/d)*f;
    }
  }
  EDGES.forEach(([a,b,s])=>{
    let na=ns.find(n=>n.id===a), nb=ns.find(n=>n.id===b);
    if(!na||!nb) return;
    let dx=nb.x-na.x, dy=nb.y-na.y;
    let d=Math.sqrt(dx*dx+dy*dy)||1;
    let ideal=(na.r+nb.r)*2.4+120;
    let f=(d-ideal)*0.004*s;
    na.vx+=(dx/d)*f; na.vy+=(dy/d)*f;
    nb.vx-=(dx/d)*f; nb.vy-=(dy/d)*f;
  });
  ns.forEach(n=>{
    if(n.id==='hub') return;
    let dx=n.x-hub.x, dy=n.y-hub.y;
    let d=Math.sqrt(dx*dx+dy*dy)||1;
    let target=W<=768?240:340;
    let f=(d-target)*0.005;
    n.vx-=(dx/d)*f; n.vy-=(dy/d)*f;
  });
  ns.forEach(n=>{ n.vx-=n.x*0.002; n.vy-=n.y*0.002; });
  hub.vx=-hub.x*0.15; hub.vy=-hub.y*0.15;
  const BOUND=W<=768?320:560;
  ns.forEach(n=>{
    n.vx*=0.82; n.vy*=0.82;
    n.x+=n.vx; n.y+=n.vy;
    let d=Math.sqrt(n.x*n.x+n.y*n.y);
    if(d>BOUND&&n.id!=='hub'){n.x*=BOUND/d;n.y*=BOUND/d;n.vx*=0.3;n.vy*=0.3;}
    if(!isFinite(n.x))n.x=0;if(!isFinite(n.y))n.y=0;
    if(!isFinite(n.vx))n.vx=0;if(!isFinite(n.vy))n.vy=0;
  });
}

function w2s(wx,wy){return[(wx-camX)*zoom+W/2,(wy-camY)*zoom+H/2]}
function s2w(sx,sy){return[(sx-W/2)/zoom+camX,(sy-H/2)/zoom+camY]}

// hex helper
function hexPath(cx,cy,r,rot){
  c.beginPath();
  for(let i=0;i<6;i++){
    let a=Math.PI/3*i+rot;
    let px=cx+r*Math.cos(a), py=cy+r*Math.sin(a);
    i===0?c.moveTo(px,py):c.lineTo(px,py);
  }
  c.closePath();
}

function spawnParticle(x1,y1,x2,y2,col){
  particles.push({x1,y1,x2,y2,t:Math.random(),col,speed:0.004+Math.random()*0.006,size:Math.random()*2+1});
}

// Energy wave: ring expanding from a node
function spawnWave(sx,sy,col){
  energyWaves.push({x:sx,y:sy,r:10,maxR:120,col,a:0.4});
}

// === PULSE BEAMS (inspired by 21st.dev PulseBeams) ===
let pulseBeams=[];
function spawnPulseBeam(na,nb){
  pulseBeams.push({na:na,nb:nb,colA:na.color,colB:nb.color,t:0,speed:0.012+Math.random()*0.008,width:2.5+Math.random()*2,len:0.15+Math.random()*0.1});
}
// Periodic beam spawning
setInterval(function(){
  if(EDGES.length===0) return;
  let e=EDGES[Math.floor(Math.random()*EDGES.length)];
  let na=NODES.find(n=>n.id===e[0]), nb=NODES.find(n=>n.id===e[1]);
  if(na&&nb) spawnPulseBeam(na,nb);
}, 800);

// === MOUSE PROXIMITY (inspired by 21st.dev Network Animation) ===
let mouseX=W/2, mouseY=H/2;
cv.addEventListener('mousemove',function(e){ mouseX=e.clientX; mouseY=e.clientY; });

function parseColor(hex){
  let r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return [r,g,b];
}

function draw() {
  t += 0.008;
  sim();

  camX+=(targetCamX-camX)*0.06;
  camY+=(targetCamY-camY)*0.06;
  zoom+=(targetZoom-zoom)*0.06;
  const CAM=W<=768?300:700;
  camX=Math.max(-CAM,Math.min(CAM,camX));
  camY=Math.max(-CAM,Math.min(CAM,camY));
  targetCamX=Math.max(-CAM,Math.min(CAM,targetCamX));
  targetCamY=Math.max(-CAM,Math.min(CAM,targetCamY));

  c.clearRect(0,0,W,H);

  // BG — deep nebula gradient
  let bgGrd=c.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.7);
  bgGrd.addColorStop(0,canvasBG.bg1);
  bgGrd.addColorStop(1,canvasBG.bg2);
  c.fillStyle=bgGrd; c.fillRect(0,0,W,H);

  // Nebula accents
  let nb1=c.createRadialGradient(W*0.3,H*0.3,0,W*0.3,H*0.3,W*0.35);
  nb1.addColorStop(0,'rgba(184,134,11,0.015)');
  nb1.addColorStop(1,'transparent');
  c.fillStyle=nb1; c.fillRect(0,0,W,H);
  let nb2=c.createRadialGradient(W*0.7,H*0.7,0,W*0.7,H*0.7,W*0.3);
  nb2.addColorStop(0,'rgba(0,212,255,0.008)');
  nb2.addColorStop(1,'transparent');
  c.fillStyle=nb2; c.fillRect(0,0,W,H);

  // Stars — twinkling
  bgStars.forEach(s=>{
    let twinkle=Math.sin(t*3+s.phase)*0.5+0.5;
    let alpha=s.a*twinkle;
    c.beginPath(); c.arc(s.x,s.y,s.r,0,Math.PI*2);
    c.fillStyle='rgba(240,236,228,'+alpha+')';
    c.fill();
  });

  // Grid dots
  const gs=50*zoom;
  const ox=(-camX*zoom+W/2)%gs, oy=(-camY*zoom+H/2)%gs;
  c.fillStyle=canvasBG.dot;
  for(let x=ox;x<W;x+=gs) for(let y=oy;y<H;y+=gs){c.beginPath();c.arc(x,y,0.7,0,Math.PI*2);c.fill();}

  // Hub orbit rings
  let [hsx,hsy]=w2s(hub.x,hub.y);
  for(let i=1;i<=3;i++){
    let orbitR=(hexR*0.55+i*55)*zoom;
    let dashLen=4+i*2;
    c.beginPath(); c.arc(hsx,hsy,orbitR,0,Math.PI*2);
    c.setLineDash([dashLen,dashLen*3]);
    c.lineDashOffset=-t*40*i;
    c.strokeStyle='rgba(184,134,11,'+(0.04-i*0.01)+')';
    c.lineWidth=0.5; c.stroke();
  }
  c.setLineDash([]);

  // Edges — energy streams
  EDGES.forEach(([a,b,s])=>{
    let na=NODES.find(n=>n.id===a), nb=NODES.find(n=>n.id===b);
    if(!na||!nb) return;
    let [x1,y1]=w2s(na.x,na.y), [x2,y2]=w2s(nb.x,nb.y);
    let isH=hovered&&(hovered.id===a||hovered.id===b);
    let isS=selected&&(selected.id===a||selected.id===b);

    // Animated dash
    let pulseFreq=1.2+s*2;
    let baseAlpha=isS?0.4:isH?0.3:0.04+s*0.06;
    let alpha=Math.max(0,Math.min(1,baseAlpha+Math.sin(t*pulseFreq)*0.08));
    let lineW=isS?3:isH?2.5:0.5+s*1.5;

    // Main line — gradient
    let edgeGr=c.createLinearGradient(x1,y1,x2,y2);
    let hexA=Math.max(0,Math.round(alpha*255)).toString(16).padStart(2,'0');
    edgeGr.addColorStop(0,na.color+hexA);
    edgeGr.addColorStop(0.5,(isS?'#ffffff':'#888888')+hexA);
    edgeGr.addColorStop(1,nb.color+hexA);
    c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2);
    c.strokeStyle=edgeGr; c.lineWidth=lineW; c.stroke();

    // Glow layer
    if(s>=0.5||isS||isH){
      let ga=Math.max(0,Math.round(alpha*0.25*255)).toString(16).padStart(2,'0');
      c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2);
      c.strokeStyle=na.color+ga;
      c.lineWidth=lineW*4; c.stroke();
    }

    // Particles — lots more
    let rate=isS?0.08:isH?0.04:s>=0.8?0.015:s>=0.4?0.008:0.003;
    if(Math.random()<rate) spawnParticle(x1,y1,x2,y2,na.color);
    // Reverse direction too
    if(Math.random()<rate*0.5) spawnParticle(x2,y2,x1,y1,nb.color);
  });

  // Particles
  particles=particles.filter(p=>{
    p.t+=p.speed;
    if(p.t>1) return false;
    let px=p.x1+(p.x2-p.x1)*p.t;
    let py=p.y1+(p.y2-p.y1)*p.t;
    let pa=1-Math.abs(p.t-0.5)*2;
    let rgb=parseColor(p.col);
    // Glow
    c.beginPath(); c.arc(px,py,p.size*3,0,Math.PI*2);
    c.fillStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+(pa*0.15)+')';
    c.fill();
    // Core
    c.beginPath(); c.arc(px,py,p.size,0,Math.PI*2);
    c.fillStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+(pa*0.8)+')';
    c.fill();
    return true;
  });

  // Energy waves
  energyWaves=energyWaves.filter(w=>{
    w.r+=2;
    w.a*=0.95;
    if(w.a<0.01) return false;
    let rgb=parseColor(w.col);
    c.beginPath(); c.arc(w.x,w.y,w.r,0,Math.PI*2);
    c.strokeStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+w.a+')';
    c.lineWidth=1.5; c.stroke();
    return true;
  });

  // === PULSE BEAMS — 21st.dev style gradient beams along edges ===
  pulseBeams=pulseBeams.filter(pb=>{
    pb.t+=pb.speed;
    if(pb.t>1+pb.len) return false;
    // Recalculate positions from live nodes
    let [x1,y1]=w2s(pb.na.x,pb.na.y);
    let [x2,y2]=w2s(pb.nb.x,pb.nb.y);
    let headT=Math.min(1,pb.t);
    let tailT=Math.max(0,pb.t-pb.len);
    let hx=x1+(x2-x1)*headT;
    let hy=y1+(y2-y1)*headT;
    let tx=x1+(x2-x1)*tailT;
    let ty=y1+(y2-y1)*tailT;
    let rgbA=parseColor(pb.colA), rgbB=parseColor(pb.colB);
    let beamGr=c.createLinearGradient(tx,ty,hx,hy);
    beamGr.addColorStop(0,'rgba('+rgbA[0]+','+rgbA[1]+','+rgbA[2]+',0)');
    beamGr.addColorStop(0.3,'rgba('+rgbA[0]+','+rgbA[1]+','+rgbA[2]+',0.6)');
    beamGr.addColorStop(0.7,'rgba(255,255,255,0.9)');
    beamGr.addColorStop(1,'rgba('+rgbB[0]+','+rgbB[1]+','+rgbB[2]+',0)');
    c.beginPath(); c.moveTo(tx,ty); c.lineTo(hx,hy);
    c.strokeStyle=beamGr; c.lineWidth=pb.width; c.lineCap='round'; c.stroke();
    // Bright head dot
    c.beginPath(); c.arc(hx,hy,pb.width*1.5,0,Math.PI*2);
    c.fillStyle='rgba(255,255,255,0.6)'; c.fill();
    c.beginPath(); c.arc(hx,hy,pb.width*4,0,Math.PI*2);
    let mix=headT;
    let mr=Math.round(rgbA[0]*(1-mix)+rgbB[0]*mix);
    let mg=Math.round(rgbA[1]*(1-mix)+rgbB[1]*mix);
    let mb=Math.round(rgbA[2]*(1-mix)+rgbB[2]*mix);
    c.fillStyle='rgba('+mr+','+mg+','+mb+',0.12)'; c.fill();
    return true;
  });

  // === MOUSE PROXIMITY GLOW — 21st.dev style ===
  if(!drag){
    let [mwx,mwy]=s2w(mouseX,mouseY);
    NODES.forEach(n=>{
      let dx=mwx-n.x, dy=mwy-n.y;
      let d=Math.sqrt(dx*dx+dy*dy);
      if(d<200&&d>n.r){
        let [sx,sy]=w2s(n.x,n.y);
        let proximity=1-d/200;
        let rgb=parseColor(n.color);
        // Subtle attraction line to cursor
        c.beginPath(); c.moveTo(sx,sy); c.lineTo(mouseX,mouseY);
        c.strokeStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+(proximity*0.08)+')';
        c.lineWidth=0.5; c.stroke();
        // Mouse glow
        c.beginPath(); c.arc(mouseX,mouseY,8*proximity,0,Math.PI*2);
        c.fillStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+(proximity*0.15)+')';
        c.fill();
      }
    });
  }

  // Nodes — hexagonal with glow
  NODES.forEach(n=>{
    let [sx,sy]=w2s(n.x,n.y);
    let r=n.r*zoom;
    let isH=hovered&&hovered.id===n.id;
    let isS=selected&&selected.id===n.id;
    let rgb=parseColor(n.color);
    let breathe=Math.sin(t*1.5+NODES.indexOf(n)*0.8)*0.04;
    let br=r*(1+breathe);

    // Outer glow — big diffuse
    if(isH||isS||n.id==='hub'){
      let glowR=br*(isS?3.5:isH?2.8:2.2);
      let gr=c.createRadialGradient(sx,sy,br*0.4,sx,sy,glowR);
      gr.addColorStop(0,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+(isS?0.18:isH?0.12:0.06)+')');
      gr.addColorStop(0.5,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0.02)');
      gr.addColorStop(1,'rgba(0,0,0,0)');
      c.beginPath(); c.arc(sx,sy,glowR,0,Math.PI*2); c.fillStyle=gr; c.fill();
    }

    // Pulse rings
    if(n.id==='hub'||isS){
      for(let i=0;i<(isS?3:2);i++){
        let pr=br+8+i*12+Math.sin(t*2.5-i*0.5)*4;
        c.beginPath(); c.arc(sx,sy,pr,0,Math.PI*2);
        c.strokeStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+(0.15-i*0.04)+')';
        c.lineWidth=0.8; c.stroke();
      }
    }

    // Hexagon body — with 3D gradient
    c.save();
    c.shadowColor='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+(isS?0.5:isH?0.35:0.2)+')';
    c.shadowBlur=isS?40:isH?25:15;

    hexPath(sx,sy,br,-Math.PI/6+Math.sin(t*0.3+NODES.indexOf(n))*0.05);
    let bodyGr=c.createRadialGradient(sx-br*0.25,sy-br*0.25,br*0.05,sx+br*0.1,sy+br*0.15,br*1.15);
    bodyGr.addColorStop(0,n.color+(isS?'ee':isH?'cc':'aa'));
    bodyGr.addColorStop(0.5,n.color+(isS?'88':isH?'66':'44'));
    bodyGr.addColorStop(1,n.color+'22');
    c.fillStyle=bodyGr; c.fill();
    c.restore();

    // Specular highlight
    hexPath(sx,sy,br,-Math.PI/6+Math.sin(t*0.3+NODES.indexOf(n))*0.05);
    let specGr=c.createRadialGradient(sx-br*0.25,sy-br*0.3,0,sx,sy,br);
    specGr.addColorStop(0,'rgba(255,255,255,'+(isS?0.22:isH?0.15:0.1)+')');
    specGr.addColorStop(0.35,'rgba(255,255,255,0.02)');
    specGr.addColorStop(1,'rgba(0,0,0,0.05)');
    c.fillStyle=specGr; c.fill();

    // Border
    hexPath(sx,sy,br,-Math.PI/6+Math.sin(t*0.3+NODES.indexOf(n))*0.05);
    c.strokeStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+(isS?0.8:isH?0.5:0.25)+')';
    c.lineWidth=isS?2:1.2; c.stroke();

    // Inner hex — subtle detail
    if(br>20){
      hexPath(sx,sy,br*0.65,-Math.PI/6+Math.sin(t*0.3+NODES.indexOf(n))*0.05);
      c.strokeStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0.08)';
      c.lineWidth=0.5; c.stroke();
    }

    // Label
    if(br>6){
      let fs=Math.max(8,Math.min(20,br*0.42));
      c.font=`700 ${fs}px Inter,sans-serif`;
      c.textAlign='center'; c.textBaseline='middle';
      // Text shadow
      c.fillStyle='rgba(0,0,0,0.5)';
      c.fillText(n.label,sx+1,sy+1);
      c.fillStyle='#fff';
      c.fillText(n.label,sx,sy);

      if(br>14){
        c.font=`500 ${Math.max(6,fs*0.48)}px 'JetBrains Mono',monospace`;
        c.fillStyle='rgba(255,255,255,0.4)';
        c.fillText(n.cat.toUpperCase(),sx,sy+br+10*zoom);
      }
    }

    // Hub — rotating hex ring
    if(n.id==='hub'){
      hexPath(sx,sy,br+14*zoom,t*0.3);
      c.strokeStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0.12)';
      c.lineWidth=0.6; c.stroke();
      hexPath(sx,sy,br+22*zoom,-t*0.2);
      c.strokeStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0.06)';
      c.lineWidth=0.5; c.stroke();
    }
  });

  // Ambient energy waves — periodic
  if(Math.random()<0.005){
    let n=NODES[Math.floor(Math.random()*NODES.length)];
    let [sx,sy]=w2s(n.x,n.y);
    spawnWave(sx,sy,n.color);
  }

  requestAnimationFrame(draw);
}

// ===== INTERACTION =====
function nodeAt(mx,my){
  let [wx,wy]=s2w(mx,my);
  for(let i=NODES.length-1;i>=0;i--){
    let n=NODES[i], dx=wx-n.x, dy=wy-n.y;
    if(dx*dx+dy*dy<(n.r+8)*(n.r+8)) return n;
  }
  return null;
}

const THEMES={
  hub:'', svyatlitsa:'theme-svyatlitsa', scyra:'theme-scyra',
  academi:'theme-academi', trade:'theme-trade', concept:'theme-svita',
  agents:'theme-agents',
};
const BG_COLORS={
  '':{bg1:'#060608',bg2:'#030305',dot:'rgba(184,134,11,0.06)'},
  'theme-svyatlitsa':{bg1:'#0a0808',bg2:'#080606',dot:'rgba(201,169,110,0.03)'},
  'theme-scyra':{bg1:'#080a10',bg2:'#060810',dot:'rgba(0,212,255,0.03)'},
  'theme-academi':{bg1:'#0a080e',bg2:'#08060c',dot:'rgba(164,139,250,0.03)'},
  'theme-trade':{bg1:'#0a080e',bg2:'#08060c',dot:'rgba(164,139,250,0.03)'},
  'theme-svita':{bg1:'#0a080e',bg2:'#08060c',dot:'rgba(164,139,250,0.03)'},
  'theme-agents':{bg1:'#0e080a',bg2:'#0c0608',dot:'rgba(212,122,154,0.03)'},
};
let canvasBG=BG_COLORS[''];

function applyTheme(tc){
  document.body.className=tc;
  canvasBG=BG_COLORS[tc]||BG_COLORS[''];
}

function selectNode(n){
  selected=n;
  if(!n){goHome(); return;}
  targetCamX=n.x-120; targetCamY=n.y;
  document.getElementById('hero-overlay').classList.add('hidden');
  document.getElementById('hint').classList.add('hidden');
  applyTheme(THEMES[n.id]||'');
  renderContent(n);
  document.getElementById('content').classList.add('open');
  // Burst of energy waves
  let [sx,sy]=w2s(n.x,n.y);
  for(let i=0;i<3;i++) setTimeout(()=>spawnWave(sx,sy,n.color),i*150);
}

function goHome(){
  selected=null;
  targetCamX=0; targetCamY=0;
  document.getElementById('content').classList.remove('open');
  document.getElementById('hero-overlay').classList.remove('hidden');
  document.getElementById('hint').classList.remove('hidden');
  applyTheme('');
}

function renderContent(n){
  let cp=document.getElementById('cp');
  let statsHTML='';
  if(n.stats){
    statsHTML='<div class="cp-stat-grid">'+n.stats.map(s=>
      `<div class="cp-stat"><div class="cp-stat-val">${s.v}</div><div class="cp-stat-lbl">${s.l}</div></div>`
    ).join('')+'</div>';
  }
  let tagsHTML=n.tags?'<div class="cp-tags">'+n.tags.map(t=>`<span class="cp-tag">${t}</span>`).join('')+'</div>':'';
  let linksHTML='';
  if(n.links&&n.links.length){
    linksHTML='<div class="cp-links">'+n.links.map(l=>
      `<a class="cp-link" href="${l.url}" target="_blank"><span class="cp-link-icon">${l.icon}</span><div><div class="cp-link-text">${l.text}</div><div class="cp-link-url">${l.note||l.url}</div></div></a>`
    ).join('')+'</div>';
  }
  let siteBtn=n.site?`<a class="cp-btn" href="${n.site}" target="_blank">${n.site.replace('https://','')}&ensp;&rarr;</a>`:'';
  cp.innerHTML=`
    <button class="cp-close" onclick="goHome()">&times;</button>
    <div class="cp-cat">${n.cat}</div>
    <div class="cp-title" style="color:${n.color}">${n.label}</div>
    <div class="cp-desc">${n.desc}</div>
    ${siteBtn}${statsHTML}${tagsHTML}
    <div class="cp-divider"></div>
    ${n.html||''}
    ${linksHTML?'<div class="cp-divider"></div>'+linksHTML:''}
  `;
  cp.parentElement.scrollTop=0;
}

cv.addEventListener('mousedown',e=>{drag=true;dragSX=e.clientX;dragSY=e.clientY;camSX=targetCamX;camSY=targetCamY;});
cv.addEventListener('mousemove',e=>{
  if(drag){targetCamX=camSX-(e.clientX-dragSX)/zoom;targetCamY=camSY-(e.clientY-dragSY)/zoom;return;}
  let prev=hovered;
  hovered=nodeAt(e.clientX,e.clientY);
  cv.style.cursor=hovered?'pointer':'grab';
  // Hover wave
  if(hovered&&hovered!==prev){let[sx,sy]=w2s(hovered.x,hovered.y);spawnWave(sx,sy,hovered.color);}
});
cv.addEventListener('mouseup',e=>{
  let wasDrag=Math.abs(e.clientX-dragSX)>4||Math.abs(e.clientY-dragSY)>4;
  drag=false;
  if(!wasDrag){let n=nodeAt(e.clientX,e.clientY);if(n)selectNode(n);else if(!document.getElementById('content').classList.contains('open'))goHome();}
});

// Touch
cv.addEventListener('touchstart',e=>{
  if(e.touches.length===1){drag=true;dragSX=e.touches[0].clientX;dragSY=e.touches[0].clientY;camSX=targetCamX;camSY=targetCamY;}
},{passive:true});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1&&drag){targetCamX=camSX-(e.touches[0].clientX-dragSX)/zoom;targetCamY=camSY-(e.touches[0].clientY-dragSY)/zoom;}
},{passive:false});
cv.addEventListener('touchend',e=>{
  drag=false;
  if(e.changedTouches.length===1){let tt=e.changedTouches[0],n=nodeAt(tt.clientX,tt.clientY);if(n)selectNode(n);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')goHome();});

// i18n hook
window.onLangChange=function(lang){
  document.documentElement.lang=lang;
  if(selected)renderContent(selected);
};

draw();
</script>
</body>
</html>
