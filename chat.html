<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #0a0a0f;
  --bg2: #12121a;
  --bg3: #1a1a26;
  --border: rgba(255,255,255,0.08);
  --text: #e0e0e8;
  --muted: #666680;
  --gold: #e8b840;
  --cyan: #00d4ff;
  --green: #22c55e;
  --purple: #a855f7;
  --red: #ef4444;
  --blue: #3b82f6;
  --orange: #f97316;
  --pink: #ec4899;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; }

/* SIDEBAR */
.sidebar {
  width: 280px; min-width: 280px; background: var(--bg2); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; height: 100vh;
}
.sidebar-head {
  padding: 20px; border-bottom: 1px solid var(--border);
}
.sidebar-head h1 { font-size: 16px; font-weight: 700; letter-spacing: 0.1em; }
.sidebar-head h1 em { color: var(--gold); font-style: normal; }
.sidebar-head p { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.15em; color: var(--muted); margin-top: 4px; text-transform: uppercase; }
.agents-list { flex: 1; overflow-y: auto; padding: 8px; }
.agent-btn {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 12px 14px; border: 1px solid transparent; border-radius: 10px;
  background: transparent; cursor: pointer; text-align: left;
  transition: all 0.2s; margin-bottom: 4px; color: var(--text);
}
.agent-btn:hover { background: var(--bg3); border-color: var(--border); }
.agent-btn.active { background: var(--bg3); border-color: var(--gold); }
.agent-avatar {
  width: 40px; height: 40px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.agent-info { flex: 1; min-width: 0; }
.agent-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent-role { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--muted); letter-spacing: 0.06em; margin-top: 2px; }
.agent-status { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; position: relative; }
.status-online { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2.5s infinite; }
.status-thinking { background: var(--orange); box-shadow: 0 0 8px var(--orange); animation: spin-pulse 1s infinite; }
.status-unread { background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
@keyframes spin-pulse { 0%{opacity:1;transform:scale(1);} 50%{opacity:0.3;transform:scale(1.4);} 100%{opacity:1;transform:scale(1);} }
.unread-badge {
  position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px;
  background: var(--red); border-radius: 8px; font-size: 9px; font-weight: 700;
  color: #fff; display: flex; align-items: center; justify-content: center;
  padding: 0 4px; font-family: 'JetBrains Mono', monospace;
}
.agent-status-wrap { position: relative; flex-shrink: 0; }
.agent-typing-label {
  font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--orange);
  letter-spacing: 0.06em; margin-top: 2px;
}
.sidebar-foot {
  padding: 14px 20px; border-top: 1px solid var(--border);
  font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--muted);
  letter-spacing: 0.08em;
}

/* CHAT AREA */
.chat-area { flex: 1; display: flex; flex-direction: column; height: 100vh; }
.chat-head {
  padding: 16px 24px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 14px; background: var(--bg2);
}
.chat-head-avatar { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.chat-head-name { font-weight: 700; font-size: 15px; }
.chat-head-role { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); }
.chat-head-status { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--green); margin-left: auto; }

.messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.msg { max-width: 75%; padding: 14px 18px; border-radius: 14px; font-size: 14px; line-height: 1.6; }
.msg-bot { background: var(--bg3); align-self: flex-start; border-bottom-left-radius: 4px; }
.msg-user { background: rgba(232,184,64,0.12); align-self: flex-end; border-bottom-right-radius: 4px; }
.msg-sender { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.1em; margin-bottom: 6px; display: block; }
.msg-bot .msg-sender { color: var(--cyan); }
.msg-user .msg-sender { color: var(--gold); }
.msg-time { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--muted); margin-top: 6px; text-align: right; }
.msg-loading { color: var(--muted); font-style: italic; }
.msg-loading::after { content: ''; animation: dots 1.5s infinite; }
@keyframes dots { 0%{content:'.'} 33%{content:'..'} 66%{content:'...'} }

.chat-input {
  padding: 16px 24px; border-top: 1px solid var(--border); background: var(--bg2);
  display: flex; gap: 12px;
}
.chat-input input {
  flex: 1; padding: 12px 18px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 10px; font-family: 'Inter', sans-serif; font-size: 14px;
  color: var(--text); outline: none; transition: border-color 0.2s;
}
.chat-input input:focus { border-color: var(--gold); }
.chat-input button {
  padding: 12px 24px; background: var(--gold); color: var(--bg); border: none;
  border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer;
  transition: all 0.2s; font-family: 'JetBrains Mono', monospace;
}
.chat-input button:hover { background: #f5cc60; }
.chat-input button:disabled { opacity: 0.4; cursor: not-allowed; }

/* Welcome screen */
.welcome { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px; color: var(--muted); }
.welcome h2 { color: var(--text); font-size: 24px; }
.welcome p { font-size: 14px; max-width: 400px; text-align: center; line-height: 1.6; }

/* LOGIN OVERLAY */
.login-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: var(--bg); display: flex; align-items: center; justify-content: center;
}
.login-overlay.hidden { display: none; }
.login-box {
  background: var(--bg2); border: 1px solid var(--border); border-radius: 16px;
  padding: 40px; width: 360px; text-align: center;

.login-box h2 { font-size: 20px; margin-bottom: 6px; }
.login-box h2 em { color: var(--gold); font-style: normal; }
.login-box p { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); letter-spacing: 0.12em; margin-bottom: 28px; text-transform: uppercase; }
.login-box input {
  width: 100%; padding: 12px 16px; background: var(--bg); border: 1px solid var(--border);
  border-radius: 10px; font-family: 'Inter', sans-serif; font-size: 14px;
  color: var(--text); outline: none; margin-bottom: 12px; transition: border-color 0.2s;
}
.login-box input:focus { border-color: var(--gold); }
.login-box button {
  width: 100%; padding: 12px; background: var(--gold); color: var(--bg); border: none;
  border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer;
  font-family: 'JetBrains Mono', monospace; margin-top: 8px; transition: background 0.2s;
}
.login-box button:hover { background: #f5cc60; }
.login-error { color: var(--red); font-size: 12px; margin-top: 12px; display: none; }

@media(max-width: 700px) {
  .sidebar { width: 70px; min-width: 70px; }
  .agent-info, .sidebar-head p, .sidebar-foot { display: none; }
  .sidebar-head h1 { font-size: 12px; text-align: center; }
  .agent-btn { justify-content: center; padding: 10px; }
  .agent-avatar { width: 36px; height: 36px; font-size: 16px; }
  .agent-status { display: none; }
}
</style>

async function sha256(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const hash = await sha256(email + ':' + pass);
  if (AUTH_HASHES.includes(hash)) {
    localStorage.setItem('labs67_auth', '1');
    localStorage.setItem('labs67_creds', JSON.stringify({e: email, p: pass}));
    document.getElementById('loginOverlay').classList.add('hidden');
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}

function togglePass() {
  const p = document.getElementById('loginPass');
  p.type = p.type === 'password' ? 'text' : 'password';
}

// State
let activeAgent = null;
let conversations = {};
let isGenerating = false;
let agentStates = {}; // 'idle' | 'thinking' | 'unread'
AGENTS.forEach(a => agentStates[a.id] = 'idle');
let unreadCounts = {};
AGENTS.forEach(a => unreadCounts[a.id] = 0);

// Render sidebar
function renderSidebar() {
  const list = document.getElementById('agentsList');
  list.innerHTML = AGENTS.map(a => {
    const state = agentStates[a.id];
    const unread = unreadCounts[a.id] || 0;
    const statusClass = state === 'thinking' ? 'status-thinking' : (state === 'unread' ? 'status-unread' : 'status-online');
    const roleOrStatus = state === 'thinking' ? `<div class="agent-typing-label">thinking...</div>` : `<div class="agent-role">${a.role}</div>`;
    const badge = unread > 0 ? `<div class="unread-badge">${unread}</div>` : '';
    return `
    <button class="agent-btn ${activeAgent === a.id ? 'active' : ''}" onclick="selectAgent('${a.id}')">
      <div class="agent-avatar" style="background:${a.color}20; color:${a.color};">${a.emoji}</div>
      <div class="agent-info">
        <div class="agent-name">${a.name}</div>
        ${roleOrStatus}
      </div>
      <div class="agent-status-wrap">
        <div class="agent-status ${statusClass}"></div>
        ${badge}
      </div>
    </button>`;
  }).join('');
}

function selectAgent(id) {
  activeAgent = id;
  if (!conversations[id]) conversations[id] = [];
  unreadCounts[id] = 0;
  if (agentStates[id] === 'unread') agentStates[id] = 'idle';
  renderSidebar();
  renderChat();
}

function renderChat() {
  const agent = AGENTS.find(a => a.id === activeAgent);
  if (!agent) return;
  const msgs = conversations[activeAgent] || [];

  document.getElementById('chatArea').innerHTML = `
    <div class="chat-head">
      <div class="chat-head-avatar" style="background:${agent.color}20; color:${agent.color};">${agent.emoji}</div>
      <div>
        <div class="chat-head-name">${agent.name}</div>
        <div class="chat-head-role">${agent.role}</div>
      </div>
      <div class="chat-head-status"><span style="color:var(--green);">&#9679;</span> Online</div>
    </div>
    <div class="messages" id="messages">
      ${msgs.map(m => `
        <div class="msg ${m.role === 'user' ? 'msg-user' : 'msg-bot'}">
          <span class="msg-sender">${m.role === 'user' ? '// YOU' : '// ' + agent.name.toUpperCase()}</span>
          ${m.text}
          <div class="msg-time">${m.time || ''}</div>
        </div>
      `).join('')}
    </div>
    <div class="chat-input">
      <input type="text" id="chatInput" placeholder="Message ${agent.name}..." onkeydown="if(event.key==='Enter'&&!isGenerating)sendMsg()" autofocus>
      <button onclick="sendMsg()" id="sendBtn">SEND</button>
    </div>
  `;
  const el = document.getElementById('messages');
  el.scrollTop = el.scrollHeight;
  document.getElementById('chatInput').focus();
}

function now() {
  return new Date().toLocaleTimeString('en', {hour:'2-digit',minute:'2-digit'});
}

async function sendMsg() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || isGenerating) return;

  const agent = AGENTS.find(a => a.id === activeAgent);
  conversations[activeAgent].push({ role: 'user', text, time: now() });
  input.value = '';
  renderChat();

  // Show loading
  isGenerating = true;
  const currentAgentId = activeAgent;
  agentStates[currentAgentId] = 'thinking';
  renderSidebar();
  document.getElementById('sendBtn').disabled = true;
  const msgs = document.getElementById('messages');
  const loadDiv = document.createElement('div');
  loadDiv.className = 'msg msg-bot msg-loading';
  loadDiv.innerHTML = `<span class="msg-sender">// ${agent.name.toUpperCase()}</span>Thinking`;
  msgs.appendChild(loadDiv);
  msgs.scrollTop = msgs.scrollHeight;

  try {
    // Build conversation history for Gemini
    const contents = [];
    // System instruction via first user message
    const history = conversations[activeAgent];
    for (const m of history) {
      contents.push({
        role: m.role === 'user' ? 'user' : 'model',
        parts: [{ text: m.text }]
      });
    }

    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: agent.system }] },
        contents,
        generationConfig: { temperature: 0.8, maxOutputTokens: 1024 }
      })
    });

    const data = await res.json();
    let reply = 'Error: no response';
    if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
      reply = data.candidates[0].content.parts[0].text;
    } else if (data.error) {
      reply = 'Error: ' + data.error.message;
    }

    conversations[activeAgent].push({ role: 'model', text: reply, time: now() });
  } catch (e) {
    conversations[activeAgent].push({ role: 'model', text: 'Connection error: ' + e.message, time: now() });
  }

  isGenerating = false;
  if (activeAgent === currentAgentId) {
    agentStates[currentAgentId] = 'idle';
  } else {
    agentStates[currentAgentId] = 'unread';
    unreadCounts[currentAgentId] = (unreadCounts[currentAgentId] || 0) + 1;
  }
  renderSidebar();
  renderChat();
}

// Init
renderSidebar();
</script>
