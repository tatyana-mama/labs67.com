<style>
:root {
  --bg: #050508;
  --panel: rgba(8,8,14,0.95);
  --card: rgba(18,18,26,0.95);
  --accent: #B8860B;
  --accent2: #D4A017;
  --accent-dim: rgba(184,134,11,0.1);
  --accent-glow: rgba(184,134,11,0.06);
  --white: #f0ece4;
  --text: #a09888;
  --muted: #555;
  --border: rgba(255,255,255,0.06);
  --border2: rgba(255,255,255,0.1);
  --cyan: #30dcff;
  --green: #1df59a;
  --purple: #a855f7;
  --pink: #ec4899;
  --serif: 'EB Garamond', Georgia, serif;
  --sans: 'Inter', sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
/* Theme transitions */
body { transition: background 0.8s ease; }
body.theme-dark { --bg:#0a0a0a; --panel:rgba(12,12,16,0.92); --card:rgba(18,18,24,0.95); --white:#f0ece4; --text:#a09888; --muted:#555; --border:rgba(255,255,255,0.06); --border2:rgba(255,255,255,0.1); }
body.theme-svyatlitsa { --bg:#0a0808; --panel:rgba(10,8,8,0.94); --accent:#c9a96e; --accent2:#dbb87a; --accent-dim:rgba(201,169,110,0.1); --white:#f0ece4; --text:#a09888; --muted:#504838; --border:rgba(201,169,110,0.08); }
body.theme-scyra { --bg:#080a10; --panel:rgba(8,10,16,0.94); --accent:#00D4FF; --accent2:#5ec4d4; --accent-dim:rgba(0,212,255,0.08); --white:#e0eaf0; --text:#8098a8; --muted:#405060; --border:rgba(0,212,255,0.08); }
body.theme-academi { --bg:#0a080e; --panel:rgba(10,8,14,0.94); --accent:#a48bfa; --accent2:#c4b0ff; --accent-dim:rgba(164,139,250,0.08); --white:#ece8f4; --text:#9088a0; --muted:#504860; --border:rgba(164,139,250,0.08); }
body.theme-trade { --bg:#0a080e; --panel:rgba(10,8,14,0.94); --accent:#a48bfa; --accent2:#c4b0ff; --accent-dim:rgba(164,139,250,0.08); --white:#ece8f4; --text:#9088a0; --muted:#504860; --border:rgba(164,139,250,0.08); }
body.theme-franchise { --bg:#0a080e; --panel:rgba(10,8,14,0.94); --accent:#a48bfa; --accent2:#c4b0ff; --accent-dim:rgba(164,139,250,0.08); --white:#ece8f4; --text:#9088a0; --muted:#504860; --border:rgba(164,139,250,0.08); }
body.theme-agents { --bg:#0e080a; --panel:rgba(14,8,10,0.94); --accent:#d47a9a; --accent2:#e8a0b8; --accent-dim:rgba(212,122,154,0.08); --white:#f0e8ec; --text:#a08890; --muted:#604850; --border:rgba(212,122,154,0.08); }
body.theme-dragona { --bg:#080a08; --panel:rgba(8,10,8,0.94); --accent:#22C55E; --accent2:#5ec482; --accent-dim:rgba(34,197,94,0.08); --white:#e8f0e8; --text:#88a088; --muted:#486048; --border:rgba(34,197,94,0.08); }
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
::selection { background: var(--gold); color: var(--bg); }

canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

/* BG OVERLAY for theme color bleed */
#bg-wash {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 0;
  background: var(--bg); transition: background 0.8s ease;
}

/* TOP BAR */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 28px; height: 48px;
  background: var(--panel); backdrop-filter: blur(24px);
  border-bottom: 1px solid var(--border);
  transition: background 0.6s, border-color 0.6s;
}
.tb-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--white); cursor: pointer; transition: color 0.6s; }
.tb-hex {
  width: 28px; height: 28px; background: linear-gradient(135deg, var(--accent), var(--accent2));
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 7px; font-weight: 600; color: #fff;
  transition: background 0.6s;
}
.tb-name { font-weight: 800; font-size: 14px; letter-spacing: 0.15em; }
.tb-name em { color: var(--accent); font-style: normal; transition: color 0.6s; }
.tb-links { display: flex; gap: 2px; }
.tb-links a {
  padding: 5px 12px; font-size: 10px; font-weight: 500; letter-spacing: 0.06em;
  color: var(--muted); text-decoration: none; border-radius: 4px; transition: all 0.3s;
  font-family: var(--mono);
}
.tb-links a:hover { color: var(--accent); background: var(--accent-dim); }
.tb-right { display: flex; align-items: center; gap: 10px; }
.tb-status {
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.1em;
  color: var(--muted); display: flex; align-items: center; gap: 6px;
}
.tb-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--green); animation: blink 2s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
@media(max-width:768px) {
  .tb-links { display: none; }
  .tb-langs { display: none; }
  .tb-right { gap: 6px; }
  .topbar { padding: 0 12px; }
  #content { width: 100vw; }
  .cp { padding: 24px 16px 60px; }
  .cp-title { font-size: 1.6rem; }
  .cp-stat-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
  .ho-name { font-size: clamp(28px, 6vw, 48px); }
  .ho-sub { font-size: 8px; letter-spacing: 0.2em; }
  #hint { font-size: 11px; bottom: 14px; padding: 7px 16px; letter-spacing: 0.08em; }
}

/* CONTENT PANEL — slides from right */
#content {
  position: fixed; top: 48px; left: 0; bottom: 0;
  width: min(520px, 85vw); z-index: 50;
  background: var(--panel); border-right: 1px solid var(--border);
  backdrop-filter: blur(30px);
  transform: translateX(-100%);
  transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), background 0.6s, border-color 0.6s;
  overflow-y: auto; overflow-x: hidden;
  scrollbar-width: thin; scrollbar-color: var(--muted) transparent;
}
#content.open { transform: translateX(0); }
#content::-webkit-scrollbar { width: 4px; }
#content::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }

.cp { padding: 32px 28px 60px; }
.cp-close {
  position: absolute; top: 12px; right: 16px;
  width: 32px; height: 32px; border: 1px solid var(--border); border-radius: 6px;
  background: transparent; color: var(--muted); font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; z-index: 10;
}
.cp-close:hover { border-color: var(--accent); color: var(--accent); }
.cp-cat { font-family: var(--mono); font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.cp-title { font-family: var(--serif); font-size: 2.2rem; color: var(--white); font-weight: 400; letter-spacing: 0.08em; line-height: 1.1; margin-bottom: 12px; }
.cp-desc { font-size: 0.9rem; line-height: 1.8; color: var(--text); margin-bottom: 24px; }
.cp-divider { height: 1px; background: var(--border); margin: 24px 0; }
.cp-section { margin-bottom: 24px; }
.cp-section h3 { font-family: var(--serif); font-size: 1.1rem; color: var(--white); font-weight: 400; margin-bottom: 8px; }
.cp-section p, .cp-section li { font-size: 0.82rem; line-height: 1.7; }
.cp-section ul { list-style: none; }
.cp-section ul li { padding: 3px 0 3px 16px; position: relative; }
.cp-section ul li::before { content: '—'; position: absolute; left: 0; color: var(--gold); }
.cp-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.cp-tag {
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.06em;
  padding: 3px 10px; border: 1px solid var(--border); border-radius: 3px; color: var(--muted);
  transition: border-color 0.4s, color 0.4s;
}
.cp-btn {
  display: inline-block; padding: 10px 24px; margin-top: 16px;
  border: 1px solid var(--accent); color: var(--accent); border-radius: 6px;
  font-size: 12px; font-weight: 600; letter-spacing: 0.06em;
  text-decoration: none; transition: all 0.2s;
}
.cp-btn:hover { background: var(--accent); color: var(--bg); }
.cp-stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin: 16px 0; }
.cp-stat { text-align: center; padding: 14px 8px; background: var(--accent-glow); border: 1px solid var(--border); border-radius: 6px; transition: background 0.6s, border-color 0.6s; }
.cp-stat-val { font-family: var(--serif); font-size: 1.4rem; color: var(--white); }
.cp-stat-lbl { font-family: var(--mono); font-size: 8px; letter-spacing: 0.1em; color: var(--muted); margin-top: 2px; }
.cp-img { width: 100%; border-radius: 6px; margin: 12px 0; border: 1px solid var(--border); }
.cp-links { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.cp-link {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  border: 1px solid var(--border); border-radius: 6px;
  text-decoration: none; color: var(--text); transition: all 0.2s;
}
.cp-link:hover { border-color: var(--accent); color: var(--accent); }
.cp-link-icon { font-size: 16px; }
.cp-link-text { font-size: 0.82rem; font-weight: 500; }
.cp-link-url { font-family: var(--mono); font-size: 9px; color: var(--muted); }

/* HERO OVERLAY — center screen when no node selected */
#hero-overlay {
  position: fixed; z-index: 20;
  top: 50%; left: 50%; transform: translate(-50%, -50%);
  text-align: center; pointer-events: none;
  transition: opacity 0.6s;
}
#hero-overlay.hidden { opacity: 0; }
.ho-name { font-weight: 800; font-size: clamp(36px, 7vw, 72px); letter-spacing: 0.12em; color: var(--white); opacity: 0.08; transition: color 0.6s; }
.ho-name em { color: var(--accent); font-style: normal; opacity: 1; transition: color 0.6s; }
.ho-sub { font-family: var(--mono); font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent); opacity: 0.4; margin-top: 8px; transition: color 0.6s; }

/* LANG SWITCHER (labs67-i18n.js plugin classes) */
.lang-switcher{position:relative}
.lang-current{
  font-family:var(--mono);font-size:9px;letter-spacing:0.06em;
  padding:4px 10px;border:1px solid var(--border);border-radius:3px;
  background:transparent;color:var(--muted);cursor:pointer;transition:all 0.2s;
  display:flex;align-items:center;gap:6px;
}
.lang-current:hover{color:var(--accent);border-color:var(--accent)}
.lang-dropdown{
  position:absolute;top:calc(100% + 6px);right:0;
  background:var(--bg2,#111118);border:1px solid var(--border);border-radius:6px;
  box-shadow:0 8px 32px rgba(0,0,0,0.4);min-width:140px;max-height:300px;overflow-y:auto;
  opacity:0;pointer-events:none;transform:translateY(-8px);transition:all 0.25s ease;z-index:200;
}
.lang-switcher.open .lang-dropdown{opacity:1;pointer-events:auto;transform:translateY(0)}
.lang-opt{
  display:block;width:100%;padding:8px 14px;border:none;background:none;
  font-family:var(--mono);font-size:10px;letter-spacing:0.04em;
  color:var(--muted);cursor:pointer;text-align:left;transition:all 0.15s;
}
.lang-opt:hover{background:rgba(255,255,255,0.04);color:var(--accent)}
.lang-opt.active{color:var(--accent);font-weight:500}

/* BOTTOM HINT */
#hint {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 30;
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em; color: var(--muted);
  background: rgba(6,6,8,0.6); padding: 6px 16px; border-radius: 20px;
  border: 1px solid var(--border); backdrop-filter: blur(10px);
  transition: opacity 0.4s;
}
#hint.hidden { opacity: 0; pointer-events: none; }

/* PULSE NAVIGATOR */
.pulse-nav{position:fixed;top:50%;right:16px;transform:translateY(-50%);width:56px;z-index:90;display:flex;flex-direction:column;align-items:center;gap:0;transition:all 0.4s cubic-bezier(0.4,0,0.2,1);background:rgba(10,10,15,0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:28px;padding:16px 0;border:1px solid rgba(184,134,11,0.1)}
.pulse-nav:hover{width:200px;border-radius:16px;border-color:rgba(184,134,11,0.25);box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.pulse-nav:hover .pn-label{opacity:1;max-width:120px;margin-left:4px}
.pulse-nav:hover .pn-ico{width:32px;height:32px}
.pn-item{display:flex;align-items:center;gap:8px;width:100%;padding:10px 16px;text-decoration:none;transition:all 0.25s;border-radius:0}
.pn-item:hover{background:rgba(184,134,11,0.1)}
.pn-item:hover .pn-label{color:var(--accent)}
.pn-ico{width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:6px;transition:all 0.3s;position:relative}
.pn-ico svg{width:16px;height:16px}
.pn-ico.active{box-shadow:0 0 12px currentColor,0 0 4px currentColor}
.pn-label{font-family:var(--mono);font-size:9px;letter-spacing:1px;color:rgba(255,255,255,0.5);white-space:nowrap;overflow:hidden;max-width:0;opacity:0;transition:all 0.35s;font-weight:300;text-transform:uppercase}
.pn-divider{width:24px;height:1px;background:rgba(255,255,255,0.06);margin:4px auto}
.pn-pulse{width:2px;height:24px;background:linear-gradient(to bottom,transparent,var(--accent),transparent);margin:6px auto;animation:pulseLine 2.5s ease-in-out infinite;opacity:0.5}
@keyframes pulseLine{0%,100%{opacity:0.15}50%{opacity:0.6}}
.pn-action{width:32px;height:32px;border:1px solid rgba(255,255,255,0.08);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:rgba(255,255,255,0.4);cursor:pointer;transition:all 0.25s;background:transparent;margin:4px auto 0}
.pn-action:hover{border-color:var(--accent);color:var(--accent);background:rgba(184,134,11,0.1)}
@media(max-width:960px){.pulse-nav{right:8px;width:44px}}
@media(max-width:480px){.pulse-nav{display:none}}
</style>
</head>

const EDGES = [
  ['hub','scyra',1], ['hub','svyatlitsa',1], ['hub','academi',1],
  ['hub','trade',1], ['hub','franchise',1], ['hub','agents',1],
  ['scyra','svyatlitsa',0.6], ['scyra','agents',0.4],
  ['svyatlitsa','academi',0.5],
  ['franchise','academi',0.5], ['agents','franchise',0.5],
];

// ===== GRAPH ENGINE =====
const cv = document.getElementById('g');
const c = cv.getContext('2d');
let W, H, dpr;
let camX = 0, camY = 0, zoom = 1;
let targetCamX = 0, targetCamY = 0, targetZoom = 1;
let drag = false, dragSX, dragSY, camSX, camSY;
let hovered = null, selected = null;
let t = 0;
let particles = [];

function resize() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  c.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Fit graph to screen — mobile gets bigger nodes
  let fitZoom = W <= 768 ? Math.min(W, H) / 800 : Math.min(W, H) / 1200;
  zoom = fitZoom; targetZoom = fitZoom;
}
window.addEventListener('resize', resize);
resize();

// Initial positions — perfect hexagon
const hub = NODES[0];
hub.x = 0; hub.y = 0; hub.vx = 0; hub.vy = 0;
const rest = NODES.slice(1);
const hexR = 340; // hexagon radius
rest.forEach((n, i) => {
  const a = (Math.PI * 2 / 6) * i - Math.PI / 2;
  n.x = Math.cos(a) * hexR;
  n.y = Math.sin(a) * hexR;
  n.vx = 0; n.vy = 0;
});

function sim() {
  const ns = NODES;
  // Repulsion
  for (let i = 0; i < ns.length; i++) {
    for (let j = i+1; j < ns.length; j++) {
      let dx = ns[j].x - ns[i].x, dy = ns[j].y - ns[i].y;
      let d = Math.sqrt(dx*dx + dy*dy) || 1;
      let f = 22000 / (d * d);
      ns[i].vx -= (dx/d)*f; ns[i].vy -= (dy/d)*f;
      ns[j].vx += (dx/d)*f; ns[j].vy += (dy/d)*f;
    }
  }
  // Attraction
  EDGES.forEach(([a,b,s]) => {
    let na = ns.find(n=>n.id===a), nb = ns.find(n=>n.id===b);
    if(!na||!nb) return;
    let dx = nb.x-na.x, dy = nb.y-na.y;
    let d = Math.sqrt(dx*dx+dy*dy)||1;
    let ideal = (na.r+nb.r)*2.4 + 120;
    let f = (d-ideal)*0.004*s;
    na.vx += (dx/d)*f; na.vy += (dy/d)*f;
    nb.vx -= (dx/d)*f; nb.vy -= (dy/d)*f;
  });
  // Center pull + equalize distance from hub
  ns.forEach(n => {
    if(n.id === 'hub') return;
    let dx = n.x - hub.x, dy = n.y - hub.y;
    let d = Math.sqrt(dx*dx + dy*dy) || 1;
    let target = W <= 768 ? 240 : 340;
    let f = (d - target) * 0.005;
    n.vx -= (dx/d) * f;
    n.vy -= (dy/d) * f;
  });
  ns.forEach(n => { n.vx -= n.x*0.002; n.vy -= n.y*0.002; });
  hub.vx = -hub.x*0.15; hub.vy = -hub.y*0.15;
  // Apply + boundary clamp (mobile-aware)
  const isMobile = W <= 768;
  const BOUND = isMobile ? 320 : 560;
  ns.forEach(n => {
    n.vx *= 0.82; n.vy *= 0.82;
    n.x += n.vx; n.y += n.vy;
    let d = Math.sqrt(n.x*n.x + n.y*n.y);
    if(d > BOUND && n.id !== 'hub') {
      n.x *= BOUND/d; n.y *= BOUND/d;
      n.vx *= 0.3; n.vy *= 0.3;
    }
  });
}

function w2s(wx,wy) { return [(wx-camX)*zoom+W/2, (wy-camY)*zoom+H/2]; }
function s2w(sx,sy) { return [(sx-W/2)/zoom+camX, (sy-H/2)/zoom+camY]; }

// Particles along edges
function spawnParticle(x1,y1,x2,y2,col) {
  particles.push({x1,y1,x2,y2,t:Math.random(),col,speed:0.003+Math.random()*0.004});
}

function draw() {
  t += 0.008;
  sim();

  // Smooth camera with bounds
  camX += (targetCamX - camX) * 0.06;
  camY += (targetCamY - camY) * 0.06;
  zoom += (targetZoom - zoom) * 0.06;
  // Clamp camera so graph doesn't fly off screen
  const CAM_BOUND = W <= 768 ? 300 : 700;
  camX = Math.max(-CAM_BOUND, Math.min(CAM_BOUND, camX));
  camY = Math.max(-CAM_BOUND, Math.min(CAM_BOUND, camY));
  targetCamX = Math.max(-CAM_BOUND, Math.min(CAM_BOUND, targetCamX));
  targetCamY = Math.max(-CAM_BOUND, Math.min(CAM_BOUND, targetCamY));

  c.clearRect(0,0,W,H);

  // Subtle radial gradient bg — uses theme colors
  let bgGrd = c.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.7);
  bgGrd.addColorStop(0, canvasBG.bg1);
  bgGrd.addColorStop(1, canvasBG.bg2);
  c.fillStyle = bgGrd;
  c.fillRect(0,0,W,H);

  // Grid dots
  const gs = 50 * zoom;
  const ox = (-camX*zoom+W/2)%gs, oy = (-camY*zoom+H/2)%gs;
  c.fillStyle = canvasBG.dot;
  for(let x=ox;x<W;x+=gs) for(let y=oy;y<H;y+=gs) { c.beginPath(); c.arc(x,y,0.7,0,Math.PI*2); c.fill(); }

  // Edges
  EDGES.forEach(([a,b,s]) => {
    let na=NODES.find(n=>n.id===a), nb=NODES.find(n=>n.id===b);
    if(!na||!nb) return;
    let [x1,y1]=w2s(na.x,na.y), [x2,y2]=w2s(nb.x,nb.y);
    let isH = hovered&&(hovered.id===a||hovered.id===b);
    let isS = selected&&(selected.id===a||selected.id===b);
    let alpha = isS ? 0.3 : isH ? 0.2 : 0.1;

    c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2);
    c.strokeStyle = isS ? na.color+'55' : isH ? `rgba(201,169,110,${alpha})` : `rgba(255,255,255,${alpha})`;
    c.lineWidth = isS ? 2 : isH ? 1.5 : 0.8;
    c.stroke();

    // Particles on active edges
    if(isS && Math.random()<0.02) spawnParticle(x1,y1,x2,y2,na.color);
  });

  // Update particles
  particles = particles.filter(p => {
    p.t += p.speed;
    if(p.t > 1) return false;
    let px = p.x1+(p.x2-p.x1)*p.t;
    let py = p.y1+(p.y2-p.y1)*p.t;
    c.beginPath(); c.arc(px,py,1.5,0,Math.PI*2);
    c.fillStyle = p.col + Math.round((1-Math.abs(p.t-0.5)*2)*80).toString(16).padStart(2,'0');
    c.fill();
    return true;
  });

  // Nodes
  NODES.forEach(n => {
    let [sx,sy] = w2s(n.x, n.y);
    let r = n.r * zoom;
    let isH = hovered && hovered.id === n.id;
    let isS = selected && selected.id === n.id;

    // Outer glow
    if(isH || isS || n.id==='hub') {
      let gr = c.createRadialGradient(sx,sy,r*0.3,sx,sy,r*(isS?3:2));
      gr.addColorStop(0, n.color + (isS?'28':'18'));
      gr.addColorStop(1, 'transparent');
      c.beginPath(); c.arc(sx,sy,r*(isS?3:2),0,Math.PI*2); c.fillStyle=gr; c.fill();
    }

    // Pulse ring (hub + selected)
    if(n.id==='hub' || isS) {
      let pr = r + 6 + Math.sin(t*2.5)*3;
      c.beginPath(); c.arc(sx,sy,pr,0,Math.PI*2);
      c.strokeStyle = n.color + '30';
      c.lineWidth = 1; c.stroke();
      if(isS) {
        let pr2 = r + 14 + Math.sin(t*1.8)*5;
        c.beginPath(); c.arc(sx,sy,pr2,0,Math.PI*2);
        c.strokeStyle = n.color + '18'; c.stroke();
      }
    }

    // Node body
    c.beginPath(); c.arc(sx,sy,r,0,Math.PI*2);
    let gr = c.createRadialGradient(sx-r*0.25,sy-r*0.25,0,sx,sy,r);
    let baseAlpha = isS ? 'ff' : isH ? 'dd' : 'aa';
    gr.addColorStop(0, n.color + baseAlpha);
    gr.addColorStop(1, n.color + (isS?'99':isH?'77':'55'));
    c.fillStyle = gr; c.fill();

    // Border
    c.beginPath(); c.arc(sx,sy,r,0,Math.PI*2);
    c.strokeStyle = n.color + (isS?'cc':isH?'99':'55');
    c.lineWidth = isS ? 2 : 1; c.stroke();

    // Label
    if(r > 6) {
      let fs = Math.max(8, Math.min(20, r*0.45));
      c.font = `700 ${fs}px Inter,sans-serif`;
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillStyle = '#fff';
      c.fillText(n.label, sx, sy);

      if(r > 14) {
        c.font = `500 ${Math.max(6,fs*0.48)}px 'JetBrains Mono',monospace`;
        c.fillStyle = 'rgba(255,255,255,0.45)';
        c.fillText(n.cat.toUpperCase(), sx, sy + r + 8*zoom);
      }
    }
  });

  requestAnimationFrame(draw);
}

// ===== INTERACTION =====
function nodeAt(mx,my) {
  let [wx,wy] = s2w(mx,my);
  for(let i=NODES.length-1;i>=0;i--) {
    let n=NODES[i], dx=wx-n.x, dy=wy-n.y;
    if(dx*dx+dy*dy < (n.r+8)*(n.r+8)) return n;
  }
  return null;
}

// Theme map per node
const THEMES = {
  hub: '', svyatlitsa: 'theme-svyatlitsa', scyra: 'theme-scyra',
  academi: 'theme-academi', trade: 'theme-trade', franchise: 'theme-franchise',
  agents: 'theme-agents',
};
// BG colors for canvas per theme
const BG_COLORS = {
  '': {bg1:'#060608',bg2:'#030305',dot:'rgba(184,134,11,0.06)',grid:'rgba(184,134,11,0.03)'},
  'theme-svyatlitsa': {bg1:'#0a0808',bg2:'#080606',dot:'rgba(201,169,110,0.03)',grid:'rgba(201,169,110,0.015)'},
  'theme-scyra': {bg1:'#080a10',bg2:'#060810',dot:'rgba(0,212,255,0.03)',grid:'rgba(0,212,255,0.015)'},
  'theme-academi': {bg1:'#0a080e',bg2:'#08060c',dot:'rgba(164,139,250,0.03)',grid:'rgba(164,139,250,0.015)'},
  'theme-trade': {bg1:'#0a080e',bg2:'#08060c',dot:'rgba(164,139,250,0.03)',grid:'rgba(164,139,250,0.015)'},
  'theme-franchise': {bg1:'#0a080e',bg2:'#08060c',dot:'rgba(164,139,250,0.03)',grid:'rgba(164,139,250,0.015)'},
  'theme-agents': {bg1:'#0e080a',bg2:'#0c0608',dot:'rgba(212,122,154,0.03)',grid:'rgba(212,122,154,0.015)'},
  'theme-dragona': {bg1:'#080a08',bg2:'#060806',dot:'rgba(34,197,94,0.03)',grid:'rgba(34,197,94,0.015)'},
  'theme-dark': {bg1:'#0a0a0a',bg2:'#080808',dot:'rgba(255,255,255,0.02)',grid:'rgba(255,255,255,0.015)'},
};
let currentTheme = '';
let canvasBG = BG_COLORS[''];

function applyTheme(themeClass) {
  document.body.className = themeClass;
  currentTheme = themeClass;
  canvasBG = BG_COLORS[themeClass] || BG_COLORS['theme-dark'];
}

function selectNode(n) {
  selected = n;
  if(!n) { goHome(); return; }
  // Pan camera so selected node is right-of-center (panel opens left)
  targetCamX = n.x - 120;
  targetCamY = n.y;
  document.getElementById('hero-overlay').classList.add('hidden');
  document.getElementById('hint').classList.add('hidden');
  applyTheme(THEMES[n.id] || 'theme-dark');
  renderContent(n);
  document.getElementById('content').classList.add('open');
}

function goHome() {
  selected = null;
  targetCamX = 0; targetCamY = 0;
  document.getElementById('content').classList.remove('open');
  document.getElementById('hero-overlay').classList.remove('hidden');
  document.getElementById('hint').classList.remove('hidden');
  applyTheme('');
}

function renderContent(n) {
  let cp = document.getElementById('cp');
  let statsHTML = '';
  if(n.stats) {
    statsHTML = '<div class="cp-stat-grid">' + n.stats.map(s =>
      `<div class="cp-stat"><div class="cp-stat-val">${s.v}</div><div class="cp-stat-lbl">${s.l}</div></div>`
    ).join('') + '</div>';
  }
  let tagsHTML = n.tags ? '<div class="cp-tags">' + n.tags.map(t=>`<span class="cp-tag">${t}</span>`).join('') + '</div>' : '';
  let linksHTML = '';
  if(n.links && n.links.length) {
    linksHTML = '<div class="cp-links">' + n.links.map(l =>
      `<a class="cp-link" href="${l.url}" target="_blank"><span class="cp-link-icon">${l.icon}</span><div><div class="cp-link-text">${l.text}</div><div class="cp-link-url">${l.note||l.url}</div></div></a>`
    ).join('') + '</div>';
  }
  let siteBtn = n.site ? `<a class="cp-btn" href="${n.site}" target="_blank">${n.site.replace('https://','')}&ensp;&rarr;</a>` : '';
  cp.innerHTML = `
    <button class="cp-close" onclick="goHome()">&times;</button>
    <div class="cp-cat">${n.cat}</div>
    <div class="cp-title" style="color:${n.color}">${n.label}</div>
    <div class="cp-desc">${n.desc}</div>
    ${siteBtn}
    ${statsHTML}
    ${tagsHTML}
    <div class="cp-divider"></div>
    ${n.html||''}
    ${linksHTML ? '<div class="cp-divider"></div>' + linksHTML : ''}
  `;
  cp.parentElement.scrollTop = 0;
}

cv.addEventListener('mousedown', e => {
  drag = true; dragSX = e.clientX; dragSY = e.clientY;
  camSX = targetCamX; camSY = targetCamY;
});
cv.addEventListener('mousemove', e => {
  if(drag) {
    targetCamX = camSX - (e.clientX - dragSX) / zoom;
    targetCamY = camSY - (e.clientY - dragSY) / zoom;
    return;
  }
  hovered = nodeAt(e.clientX, e.clientY);
  cv.style.cursor = hovered ? 'pointer' : 'grab';
});
cv.addEventListener('mouseup', e => {
  let wasDrag = Math.abs(e.clientX-dragSX)>4 || Math.abs(e.clientY-dragSY)>4;
  drag = false;
  if(!wasDrag) {
    let n = nodeAt(e.clientX, e.clientY);
    if(n) selectNode(n);
    else if(!document.getElementById('content').classList.contains('open')) goHome();
  }
});
// No scroll zoom — fixed scale

// Touch
let lastDist=0;
cv.addEventListener('touchstart', e => {
  if(e.touches.length===1) { drag=true; dragSX=e.touches[0].clientX; dragSY=e.touches[0].clientY; camSX=targetCamX; camSY=targetCamY; }
  // no pinch zoom
},{passive:true});
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  if(e.touches.length===1&&drag) { targetCamX=camSX-(e.touches[0].clientX-dragSX)/zoom; targetCamY=camSY-(e.touches[0].clientY-dragSY)/zoom; }
  // no pinch zoom on move
},{passive:false});
cv.addEventListener('touchend', e => {
  drag=false; lastDist=0;
  if(e.changedTouches.length===1) { let tt=e.changedTouches[0], n=nodeAt(tt.clientX,tt.clientY); if(n) selectNode(n); }
});

// Keyboard
document.addEventListener('keydown', e => { if(e.key==='Escape') goHome(); });

function applyLang(lang){
  curLang = lang;
  localStorage.setItem('labs67lang', lang);
  // Update static UI
  document.querySelector('.ho-sub').textContent = tr('hero_sub');
  document.getElementById('hint').textContent = tr('hint');
  // Update html lang
  document.documentElement.lang = lang;
  // Re-render content panel if open
  if(selected) renderContent(selected);
}

/* Lang switcher built by labs67-i18n.js plugin */
/* Hook: apply custom graph translations on lang change */
window.onLangChange = function(lang) { applyLang(lang); };

// Override renderContent to use i18n descriptions
const origRenderContent = renderContent;
// Patch node desc on render
function renderContent(n){
  const dk = DESC_MAP[n.id];
  const localDesc = dk ? tr(dk) : n.desc;
  const hk = HTML_MAP && HTML_MAP[n.id];
  const localHtml = hk ? tr(hk) : '';
  const patched = Object.assign({}, n, {desc: localDesc});
  if(localHtml) patched.html = localHtml;
  // call original logic inline
  let cp = document.getElementById('cp');
  let statsHTML = '';
  if(patched.stats) {
    statsHTML = '<div class="cp-stat-grid">' + patched.stats.map(s =>
      `<div class="cp-stat"><div class="cp-stat-val">${s.v}</div><div class="cp-stat-lbl">${s.l}</div></div>`
    ).join('') + '</div>';
  }
  let tagsHTML = patched.tags ? '<div class="cp-tags">' + patched.tags.map(t=>`<span class="cp-tag">${t}</span>`).join('') + '</div>' : '';
  let linksHTML = '';
  if(patched.links && patched.links.length) {
    linksHTML = '<div class="cp-links">' + patched.links.map(l =>
      `<a class="cp-link" href="${l.url}" target="_blank"><span class="cp-link-icon">${l.icon}</span><div><div class="cp-link-text">${l.text}</div><div class="cp-link-url">${l.note||l.url}</div></div></a>`
    ).join('') + '</div>';
  }
  let siteBtn = patched.site ? `<a class="cp-btn" href="${patched.site}" target="_blank">${patched.site.replace('https://','')}&ensp;&rarr;</a>` : '';
  cp.innerHTML = `
    <button class="cp-close" onclick="goHome()">&times;</button>
    <div class="cp-cat">${patched.cat}</div>
    <div class="cp-title" style="color:${patched.color}">${patched.label}</div>
    <div class="cp-desc">${patched.desc}</div>
    ${siteBtn}
    ${statsHTML}
    ${tagsHTML}
    <div class="cp-divider"></div>
    ${patched.html||''}
    ${linksHTML ? '<div class="cp-divider"></div>' + linksHTML : ''}
  `;
  cp.parentElement.scrollTop = 0;
}

/* Initial lang applied by labs67-i18n.js on DOMContentLoaded */

draw();
</script>
</body>
</html>
